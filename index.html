<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheong-woo Art | 유인경 작가</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; background-color: #fafafa; }
        header { padding: 40px; text-align: center; }
        .artwork { width: 100%; max-width: 500px; height: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .poem { margin: 30px; font-size: 1.1rem; color: #555; text-align: center; }
    </style>
</head>
<body>
    <header><h1>CHEONG-WOO</h1></header>
    <main style="text-align: center;">
        <!-- 파일명을 정확히 확인해주세요 -->
        <img src="유인경 39759.jpg" alt="매화(한지에 수묵담채)" class="artwork" onerror="this.style.display='none'; alert('그림 파일을 찾을 수 없습니다. 파일명을 다시 확인해주세요.');">
        <div class="poem">
            물끄러미 바라본 그곳<br><br>
            봄볕에 흔들이는 바람같다<br>
            마음 머무는 풍경속 바람되어<br>
            그 곁애(愛) 머물다
        </div>
    </main>
</body>
</html>
